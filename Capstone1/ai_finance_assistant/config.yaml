llm:
  # Cheap model for development. Any OpenAI chat model your key can access works.
  model: gpt-4o-mini
  temperature: 0.2
  timeout_seconds: 30
compliance:
  disclaimer: >-
    This is general financial education, not personalized financial, tax, or
    legal advice. Consider consulting a licensed professional before acting.
market_data:
  quote_ttl_seconds: 60
  history_ttl_seconds: 3600
  rate_limit_cooldown_seconds: 60
  request_timeout_seconds: 10
portfolio:
  benchmark: ^GSPC  # S&P 500
  risk_period: 1y
  risk_free_rate: 0.04  # assumption used in the Sharpe ratio
goals:
  inflation: 0.025
  simulations: 5000
  random_seed: 42  # same inputs give the same result
  # Illustrative long-term assumptions, not forecasts. Nominal annual values.
  risk_profiles:
    conservative: {expected_return: 0.04, volatility: 0.06}
    moderate: {expected_return: 0.06, volatility: 0.11}
    aggressive: {expected_return: 0.08, volatility: 0.16}
rag:
  articles_dir: src/data/knowledge_base
  persist_dir: chroma_db
  collection: finance_kb
  embedding_model: text-embedding-3-small
  chunk_size: 900
  chunk_overlap: 120
  top_k: 4
  min_score: 0.3  # starting value, to be tuned with the retrieval evals
news:
  cache_ttl_seconds: 900
  max_articles: 6
tracing:
  project_name: ai-finance-assistant
pricing:  # USD per 1M tokens, from OpenAI's docs on 2026-11-01. Update when the model changes.
  input_per_million: 0.15
  output_per_million: 0.60
